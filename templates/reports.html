<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>SOC Suite — Reports</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Exo+2:wght@300;400;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/static/css/style.css"/>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="logo"><span class="logo-icon">⚡</span><span class="logo-text">SOC Console</span></div>
    <nav class="nav">
      <a href="/"        class="nav-item">▪ Dashboard</a>
      <a href="/scanner" class="nav-item">◉ Network Scanner</a>
      <a href="/logs"    class="nav-item">≡ Log Analysis</a>
      <a href="/network" class="nav-item">⊞ Network Monitor</a>
      <a href="/payload" class="nav-item">⚙ Payload Lab</a>
      <a href="/hash"    class="nav-item"># Hash Tools</a>
      <a href="/reports" class="nav-item active">📄 Reports</a>
    </nav>
    <div class="sidebar-footer"><span class="status-dot"></span>All Systems Online</div>
  </div>

  <div class="main">
    <div class="topbar">
      <span class="page-title">Reports</span>
      <span class="clock" id="clock">--:--:--</span>
    </div>
    <div class="content">

      <!-- GENERATE MANUAL REPORT -->
      <div class="card">
        <div class="section-header">Generate Manual Report</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px">
          <div>
            <div class="hash-label">Report Type</div>
            <select class="soc-input" style="margin-top:6px;width:100%" id="report-type">
              <option value="Port Scan">Port Scan</option>
              <option value="Log Analysis">Log Analysis</option>
              <option value="Network Monitor">Network Monitor</option>
              <option value="General">General Security</option>
            </select>
          </div>
          <div>
            <div class="hash-label">Severity</div>
            <select class="soc-input" style="margin-top:6px;width:100%" id="report-sev">
              <option value="LOW">LOW</option>
              <option value="MEDIUM">MEDIUM</option>
              <option value="HIGH">HIGH</option>
              <option value="CRITICAL">CRITICAL</option>
            </select>
          </div>
          <div>
            <div class="hash-label">Target / System</div>
            <input class="soc-input" style="margin-top:6px" id="report-target"
              placeholder="e.g. 192.168.1.1 or Web Server"/>
          </div>
          <div>
            <div class="hash-label">Summary</div>
            <input class="soc-input" style="margin-top:6px" id="report-summary"
              placeholder="Brief description of findings..."/>
          </div>
        </div>

        <!-- FINDINGS -->
        <div class="hash-label" style="margin-bottom:8px">Findings
          <button class="copy-btn" style="margin-left:10px"
            onclick="addFinding()">+ Add Finding</button>
        </div>
        <div id="findings-list"></div>

        <div style="margin-top:14px">
          <button class="soc-btn" onclick="generateReport()">
            Generate PDF Report
          </button>
        </div>
        <div id="gen-status" style="margin-top:10px;font-size:13px;
          font-family:var(--mono);display:none"></div>
      </div>

      <!-- SAVED REPORTS -->
      <div class="card">
        <div style="display:flex;justify-content:space-between;
            align-items:center;margin-bottom:14px">
          <div class="section-header" style="margin:0">Saved Reports</div>
          <button class="soc-btn outline" style="font-size:12px"
            onclick="loadReports()">Refresh</button>
        </div>
        <div id="reports-list">
          <div style="color:var(--muted);font-size:13px;text-align:center;
            padding:20px">Loading reports...</div>
        </div>
      </div>

    </div>
  </div>
</div>

<script>
setInterval(() => {
  document.getElementById('clock').textContent = new Date().toTimeString().split(' ')[0];
}, 1000);

let findings = [];

function addFinding() {
  const id = Date.now();
  findings.push({ id, type: '', severity: 'HIGH', details: '' });
  renderFindings();
}

function removeFinding(id) {
  findings = findings.filter(f => f.id !== id);
  renderFindings();
}

function renderFindings() {
  const list = document.getElementById('findings-list');
  if (findings.length === 0) {
    list.innerHTML = `<div style="color:var(--muted);font-size:12px;
      padding:10px;text-align:center">
      No findings added. Click "+ Add Finding" to add one.
    </div>`;
    return;
  }
  list.innerHTML = findings.map(f => `
    <div style="display:grid;grid-template-columns:1fr 120px 2fr 40px;
        gap:8px;margin-bottom:8px;align-items:center">
      <input class="soc-input" placeholder="Finding type..."
        value="${f.type}"
        onchange="updateFinding(${f.id},'type',this.value)"
        style="font-size:12px;padding:8px 10px"/>
      <select class="soc-input"
        onchange="updateFinding(${f.id},'severity',this.value)"
        style="font-size:12px;padding:8px 10px">
        <option ${f.severity==='LOW'?'selected':''}>LOW</option>
        <option ${f.severity==='MEDIUM'?'selected':''}>MEDIUM</option>
        <option ${f.severity==='HIGH'?'selected':''}>HIGH</option>
        <option ${f.severity==='CRITICAL'?'selected':''}>CRITICAL</option>
      </select>
      <input class="soc-input" placeholder="Details..."
        value="${f.details}"
        onchange="updateFinding(${f.id},'details',this.value)"
        style="font-size:12px;padding:8px 10px"/>
      <button class="soc-btn danger"
        onclick="removeFinding(${f.id})"
        style="padding:8px;font-size:12px">✕</button>
    </div>`).join('');
}

function updateFinding(id, field, value) {
  const f = findings.find(x => x.id === id);
  if (f) f[field] = value;
}

async function generateReport() {
  const type    = document.getElementById('report-type').value;
  const sev     = document.getElementById('report-sev').value;
  const target  = document.getElementById('report-target').value || 'N/A';
  const summary = document.getElementById('report-summary').value;

  const status = document.getElementById('gen-status');
  status.style.display = 'block';
  status.style.color   = 'var(--cyan)';
  status.textContent   = '[*] Generating PDF report...';

  try {
    const res = await fetch('/api/reports/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        type, severity: sev, target, summary,
        findings: findings.map(f => ({
          type: f.type || 'Finding',
          severity: f.severity,
          details: f.details
        }))
      })
    });
    const data = await res.json();

    if (data.status === 'success') {
      status.style.color = 'var(--green)';
      status.textContent = '✅ Report generated: ' + data.filename;
      loadReports();
    } else {
      status.style.color = 'var(--red)';
      status.textContent = '❌ Error: ' + (data.error || 'Unknown error');
    }
  } catch (err) {
    status.style.color   = 'var(--red)';
    status.textContent   = '❌ Error: ' + err.message;
  }
}

async function loadReports() {
  const res  = await fetch('/api/reports/list');
  const data = await res.json();
  const list = document.getElementById('reports-list');

  if (data.error) {
    list.innerHTML = `<div style="color:var(--red)">${data.error}</div>`;
    return;
  }

  if (data.reports.length === 0) {
    list.innerHTML = `<div style="color:var(--muted);font-size:13px;
      text-align:center;padding:20px">
      No reports yet. Generate one using the Scanner, Log Analysis,
      Network Monitor or the form above.
    </div>`;
    return;
  }

  list.innerHTML = data.reports.map(r => `
    <div style="background:var(--bg3);border:1px solid var(--border);
        border-radius:8px;padding:12px 16px;display:flex;
        justify-content:space-between;align-items:center;margin-bottom:8px">
      <div>
        <div style="font-size:13px;font-weight:600;
            font-family:var(--mono);color:var(--cyan)">
          📄 ${r.filename}
        </div>
        <div style="font-size:11px;color:var(--muted);margin-top:4px">
          Created: ${r.created} &nbsp;|&nbsp;
          Size: ${(r.size/1024).toFixed(1)} KB
        </div>
      </div>
      <div style="display:flex;gap:8px">
        <a href="/api/reports/download/${r.filename}"
           class="soc-btn outline"
           style="font-size:11px;padding:6px 14px;text-decoration:none">
          ⬇ Download
        </a>
        <button class="soc-btn danger"
          style="font-size:11px;padding:6px 14px"
          onclick="deleteReport('${r.filename}')">
          ✕
        </button>
      </div>
    </div>`).join('');
}

async function deleteReport(filename) {
  if (!confirm('Delete report: ' + filename + '?')) return;
  // Simple delete by reloading — add delete API if needed
  alert('To delete, manually remove from reports_output folder.');
}

// Load on page open
loadReports();
renderFindings();
</script>
</body>
</html>
